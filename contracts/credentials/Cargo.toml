[package]
name = "credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
asterism-types = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Tests register a real registry. The contract itself talks to the registry
# only through the generated client below and does not link its code.
attestation-registry = { path = "../attestation-registry" }
