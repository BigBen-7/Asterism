name: Feature request
description: Propose a change or a piece of planned work
labels: ["type: feature"]
body:
  - type: textarea
    id: context
    attributes: { label: Context }
    validations: { required: true }
  - type: textarea
    id: task
    attributes: { label: Task }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Observable, testable outcomes }
    validations: { required: true }
  - type: textarea
    id: hints
    attributes:
      {
        label: Notes / hints,
        description: Files and docs to start from. Mark anything unverified as needs-verification.,
      }
  - type: textarea
    id: out
    attributes: { label: Out of scope, description: What this issue must NOT include }
