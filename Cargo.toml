[workspace]
resolver = "2"
members = ["contracts/attestation-registry", "contracts/credentials", "crates/asterism-types", "services/api", "services/indexer"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Chain-Explain/Asterism"
publish = false

[workspace.dependencies]
soroban-sdk = "25"
asterism-types = { path = "crates/asterism-types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
